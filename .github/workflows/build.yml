name: Build

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # No Windows: ocsigenserver, which eliom pulls in, is not available there
        # ('os != "win32"' in its opam file), so opam cannot even find a solution.
        os:
          - macos-latest
          - ubuntu-latest
        # OCaml 5.3+: eliom -> ocsigenserver -> cohttp-lwt-unix >= 6.0 ->
        # ppx_sexp_conv needs 5.1 or later, and pgocaml only supports OCaml 5 from
        # its 4.4.0. The doc CI builds on 5.4.
        ocaml-compiler:
          - "5.3"
          - "5.4"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-pin: false

      # wasm_of_ocaml (pulled in via eliom) needs binaryen's wasm-merge.
      - name: Set-up Binaryen
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}

      - name: Refresh the apt index (Linux)
        if: runner.os == 'Linux'
        # opam installs the system dependencies (imagemagick, ruby-sass, ...)
        # through apt; with the runner image's stale index, the mirror answers
        # 404 for superseded package versions.
        run: sudo apt-get update

      - name: Set up libpq (macOS)
        if: runner.os == 'macOS'
        # conf-postgresql, which pgocaml pulls in, looks for libpq through
        # pkg-config. Homebrew keeps libpq keg-only, so its pkgconfig directory
        # has to be named explicitly or the probe fails.
        run: |
          brew install libpq
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      # Ocsigen Server 8.0.0 and ocsipersist 3.1.0 are released on GitHub but
      # not yet published on opam (ocaml/opam-repository#30806): pin the
      # release tags. ocsipersist needs explicit versions, as opam infers a
      # pinned package's version from opam-repository when the project
      # declares none. The rest of the modernized stack is unreleased: pin
      # the default branches, or the development branch where not merged yet.
      - run: |
          opam pin -yn git+https://github.com/ocsigen/ocsigenserver#8.0.0
          for p in ocsipersist-lib ocsipersist ocsipersist-pgsql ocsipersist-pgsql-config; do
            opam pin -yn $p.3.1.0 git+https://github.com/ocsigen/ocsipersist#3.1.0
          done
          opam pin -yn git+https://github.com/ocsigen/eliom#master
          opam pin -yn git+https://github.com/ocsigen/ocsigen-toolkit#modernize
          opam pin -yn git+https://github.com/ocsigen/ocsigen-dune-rules#modernize
          opam pin -yn git+https://github.com/ocsigen/ocsigen-ppx-rpc#main
          opam pin -yn git+https://github.com/ocsigen/ocsigen-i18n#master

      # The version comes from the opam file: the generated project requires
      # ocsigen-start >= 9.0~.
      - run: opam pin add ocsigen-start . --no-action

      - run: opam install .

      - run: mkdir -p template

      - run: opam exec -- eliom-distillery -name template -template os

      # Make the generated project its own dune root. It lives inside the
      # ocsigen-start checkout, which ships a dune-project; without this, dune
      # would take ocsigen-start as the root and treat the project as a nested
      # subdirectory, which breaks Eliom's client/server value linking
      # ("Inferred type of client value not found. You need to regenerate ...").
      - run: echo '(lang dune 3.0)' > template/dune-workspace

      - run: opam install -y .
        working-directory: template

      - run: make USE_SASS=no db-init db-create db-schema
        working-directory: template

      - run: opam exec -- make USE_SASS=no all
        working-directory: template
