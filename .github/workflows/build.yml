name: Build

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # No Windows: ocsigenserver, which eliom pulls in, is not available there
        # ('os != "win32"' in its opam file), so opam cannot even find a solution.
        os:
          - macos-latest
          - ubuntu-latest
        # OCaml 5.3+: eliom -> ocsigenserver -> cohttp-lwt-unix >= 6.0 ->
        # ppx_sexp_conv needs 5.1 or later, and pgocaml only supports OCaml 5 from
        # its 4.4.0. The doc CI builds on 5.4.
        ocaml-compiler:
          - "5.3"
          - "5.4"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-pin: false

      - run: |
          opam pin add -n eliom https://github.com/ocsigen/eliom.git
          opam pin add -n ocsigen-toolkit https://github.com/ocsigen/ocsigen-toolkit.git

      - run: opam pin add ocsigen-start.7.0.0 . --no-action

      - run: opam install .

      - run: mkdir -p template

      - run: opam exec -- eliom-distillery -name template -template os.pgocaml

      - run: opam install -y .
        working-directory: template

      - run: make USE_SASS=no db-init db-create db-schema
        working-directory: template

      - run: opam exec -- make USE_SASS=no all
        working-directory: template
